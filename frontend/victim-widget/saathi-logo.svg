<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="saffronGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF9933"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#138808"/>
      <stop offset="100%" stop-color="#0E6B05"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B57A6"/>
      <stop offset="100%" stop-color="#0B2B5C"/>
    </linearGradient>
  </defs>

  <!-- Circular Base Badge -->
  <circle cx="60" cy="60" r="57" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Concentric Outer Tricolor Ring (Sambal Style) -->
  <circle cx="60" cy="60" r="53" fill="none" stroke="#F1F5F9" stroke-width="1"/>
  <!-- Saffron Upper Left Arc -->
  <path d="M 23,60 A 42,42 0 0,1 60,18" fill="none" stroke="url(#saffronGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Green Upper Right Arc -->
  <path d="M 60,18 A 42,42 0 0,1 97,60" fill="none" stroke="url(#greenGrad)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Lion Capital / Ashoka emblem motif at top apex -->
  <g transform="translate(60, 20) scale(0.65)">
    <path d="M -4,-2 L 0,-6 L 4,-2 L 2,2 L -2,2 Z" fill="#1B57A6"/>
    <circle cx="0" cy="-1" r="1" fill="#FFFFFF"/>
  </g>

  <!-- Acoustic Radiance / Aura Rings (Crisis & Speech assessment) -->
  <circle cx="60" cy="52" r="20" fill="none" stroke="#DBEAFE" stroke-width="1.2" stroke-dasharray="3 2"/>
  <circle cx="60" cy="52" r="15" fill="none" stroke="#BFDBFE" stroke-width="1.2"/>
  <circle cx="60" cy="52" r="10" fill="#EFF6FF"/>

  <!-- Protective Sheltering Hands (Exact Sambal Archetype) -->
  <!-- Top Navy Protective Shield/Hand -->
  <path d="M 40,36 C 50,28 70,28 80,36 C 76,32 68,30 60,30 C 52,30 44,32 40,36 Z" fill="url(#blueGrad)"/>
  
  <!-- Left Supporting Hand (Saffron) -->
  <path d="M 36,66 C 33,56 34,46 39,39 C 41,44 42,51 43,56 C 44,61 46,67 52,71 C 45,71 40,69 36,66 Z" fill="url(#saffronGrad)"/>
  
  <!-- Right Supporting Hand (Green) -->
  <path d="M 84,66 C 87,56 86,46 81,39 C 79,44 78,51 77,56 C 76,61 74,67 68,71 C 75,71 80,69 84,66 Z" fill="url(#greenGrad)"/>

  <!-- Sheltered Person / Companion Figure -->
  <circle cx="60" cy="47" r="5" fill="#0B2B5C"/>
  <path d="M 51,64 C 51,56 55,53 60,53 C 65,53 69,56 69,64 Z" fill="#0B2B5C"/>

  <!-- Typography: SAATHI साथी (Refined & Dignified) -->
  <text x="60" y="86" font-family="'Noto Sans', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="800" fill="#0B2B5C" text-anchor="middle" letter-spacing="1.2">SAATHI</text>
  <text x="60" y="97" font-family="'Noto Sans', 'Segoe UI', Arial, sans-serif" font-size="7.5" font-weight="600" fill="#334155" text-anchor="middle">साथी</text>

  <!-- Tricolor Accent Baseline -->
  <line x1="34" y1="102" x2="50" y2="102" stroke="#FF9933" stroke-width="2" stroke-linecap="round"/>
  <line x1="54" y1="102" x2="66" y2="102" stroke="#0B2B5C" stroke-width="2" stroke-linecap="round"/>
  <line x1="70" y1="102" x2="86" y2="102" stroke="#138808" stroke-width="2" stroke-linecap="round"/>
</svg>